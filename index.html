<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwuMode - Free Windows Modes</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="brand">
                <span class="brand-logo">O</span>
                <span class="brand-name">OwuMode</span>
            </a>

            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="index.html#Modes" class="nav-link">Modes</a>
            </nav>

            <div class="header-search">
                <input type="search" id="headerSearch" placeholder="Search Modes..." autocomplete="off">
            </div>

            <div class="visitor-counter" title="Total Visitors">
                <span class="visitor-icon">👁</span>
                <span class="visitor-number" id="visitorCount">0</span>
            </div>

            <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>


    <!-- ==================== MAIN ==================== -->
    <main>

        <!-- Hero -->
        <section class="hero">
            <div class="container hero-inner">

                <div class="hero-content">
                    <span class="hero-label">OwuMode Modes</span>
                    <h1>Game Modes <span>For Windows</span></h1>
                    <p>Discover and download Windows Modes from OwuMode.</p>
                    <a href="#Modes" class="hero-btn">Browse Modes</a>
                </div>

                <div class="hero-decoration">
                    <div class="controller">
                        <div class="controller-left">
                            <span class="dpad-up"></span>
                            <span class="dpad-down"></span>
                            <span class="dpad-left"></span>
                            <span class="dpad-right"></span>
                        </div>
                        <div class="controller-center">
                            <span></span>
                            <span></span>
                        </div>
                        <div class="controller-right">
                            <span class="button-y">Y</span>
                            <span class="button-x">X</span>
                            <span class="button-a">A</span>
                            <span class="button-b">B</span>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Modes Grid -->
        <section class="Modes-section" id="Modes">
            <div class="container">

                <div class="section-header">
                    <div>
                        <span class="section-label">OwuMode</span>
                        <h2>Modes</h2>
                    </div>
                    <div class="game-count">
                        <span id="gameCount">0</span> Modes
                    </div>
                </div>

                <div class="game-grid" id="gameGrid"></div>

                <div class="empty-state" id="noModes" style="display: none;">
                    <div class="empty-icon">⌕</div>
                    <h3>No Modes found</h3>
                    <p>Try searching with a different game name.</p>
                </div>

            </div>
        </section>

    </main>


    <!-- ==================== TOAST ==================== -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>


    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <span class="brand-logo">O</span>
                <span>OwuMode</span>
            </div>
            <p>© 2026 OwuMode. All rights reserved.</p>
        </div>
    </footer>


    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
